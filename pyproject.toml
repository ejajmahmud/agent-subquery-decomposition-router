[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-subquery-decomposition-router"
version = "0.1.0"
description = "Deconstructs complex multi-aspect user questions into atomic subqueries and routes each to specialized retrieval indexes"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-subquery-decomposition-router = "agent_subquery_decomposition_router.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_subquery_decomposition_router*"]
